<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a3a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>کارت من</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap">
<style>
:root{--bg:#0f2a3a;--paper:#f2f6f7;--ink:#10212b;--mute:#5d7280;--accent:#e0a82e;--line:#d3dde2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
main{width:100%;max-width:440px}
.card{background:var(--paper);border-radius:22px;overflow:hidden}
.head{background:var(--ink);color:#fff;padding:28px 24px 22px;border-bottom:6px solid var(--accent)}
.head h1{margin:0;font-size:26px;font-weight:900;line-height:1.4}
.head p{margin:6px 0 0;color:#b9cad3;font-size:15px}
.pad{padding:18px 24px}
label{display:block;margin-bottom:14px}
label span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input.ltr{direction:ltr;text-align:right}
input:focus,textarea:focus{outline:3px solid var(--accent);border-color:var(--ink)}
button{width:100%;font:inherit;font-weight:700;font-size:16px;padding:14px;border:0;border-radius:14px;background:var(--accent);color:var(--ink);cursor:pointer;margin-top:8px}
button.alt{background:transparent;border:2px solid var(--ink)}
button:focus-visible,.row:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.row{display:block;padding:14px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.row:last-child{border-bottom:0}
.k{font-size:12.5px;color:var(--mute)}
.v{font-size:17px;font-weight:700;margin-top:2px;word-break:break-word}
.v.ltr{direction:ltr;text-align:right}
#qrbox{text-align:center;padding:18px 24px 6px}
#qrbox canvas,#qrbox img{width:100%;max-width:280px;height:auto;image-rendering:pixelated;background:#fff;padding:12px;border-radius:14px}
.hint{font-size:13px;color:var(--mute);line-height:1.9;text-align:center;margin:10px 0 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px}
</style>
</head>
<body>
<main><div class="card" id="app"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const FIELDS=[
 ["name","نام و نام خانوادگی",""],["title","عنوان / شغل",""],
 ["phone","تلفن","ltr"],["email","ایمیل","ltr"],["web","وب‌سایت","ltr"],
 ["insta","اینستاگرام","ltr"],["address","آدرس",""],["note","توضیحات","area"]
];
const KEY="my-card-v1";
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}

/* ---------- encode / decode ---------- */
const toB64u=b=>btoa(String.fromCharCode(...b)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const fromB64u=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
async function encode(obj){
  const bytes=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){
    const s=new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    const z=new Uint8Array(await new Response(s).arrayBuffer());
    if(z.length<bytes.length)return "z"+toB64u(z);
  }
  return toB64u(bytes);
}
async function decode(raw){
  let bytes;
  if(raw[0]==="z"){
    const s=new Blob([fromB64u(raw.slice(1))]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    bytes=new Uint8Array(await new Response(s).arrayBuffer());
  }else bytes=fromB64u(raw);
  return JSON.parse(new TextDecoder().decode(bytes));
}
const baseUrl=()=>location.origin+location.pathname;

/* ---------- form mode ---------- */
function showForm(){
  const d=load();
  let h='<div class="head"><h1>کارت من</h1><p>اطلاعات یک‌بار ذخیره می‌شه و بدون اینترنت می‌مونه</p></div><div class="pad">';
  for(const [k,t,c] of FIELDS){
    h+='<label><span>'+t+'</span>'+(c==="area"
      ?'<textarea id="f_'+k+'" rows="3">'+esc(d[k]||"")+'</textarea>'
      :'<input id="f_'+k+'" class="'+c+'" value="'+esc(d[k]||"")+'" autocomplete="off">')+'</label>';
  }
  h+='<button id="btnSave">ذخیره</button></div><div id="qrbox"></div><div class="pad" id="shareRow" hidden></div>';
  app.innerHTML=h;
  document.getElementById("btnSave").onclick=save;
  if(d.name)makeQR(d);
}
function collect(){const d={};for(const [k] of FIELDS){const v=document.getElementById("f_"+k).value.trim();if(v)d[k]=v}return d}
async function save(){
  const d=collect();
  if(!d.name){toast("نام را وارد کنید");return}
  localStorage.setItem(KEY,JSON.stringify(d));
  toast("ذخیره شد");
  makeQR(d);
}
async function makeQR(d){
  const url=baseUrl()+"#"+await encode(d);
  const box=document.getElementById("qrbox");
  if(typeof qrcode==="undefined"){box.innerHTML='<p class="hint">برای ساخت QR یک‌بار با اینترنت صفحه را باز کنید.</p>';return}
  let qr;
  try{qr=qrcode(0,"L");qr.addData(url,"Byte");qr.make()}
  catch(e){box.innerHTML='<p class="hint">اطلاعات برای QR زیاد است. متن‌ها را کوتاه‌تر کنید.</p>';return}
  box.innerHTML=qr.createImgTag(8,0)+'<p class="hint">دوربین گوشی طرف مقابل را روی این کد بگیرید تا کارت شما باز شود.</p>';
  const row=document.getElementById("shareRow");row.hidden=false;
  row.innerHTML='<button class="alt" id="btnShare">اشتراک‌گذاری لینک</button>';
  document.getElementById("btnShare").onclick=async()=>{
    if(navigator.share){try{await navigator.share({title:d.name,url})}catch(e){}}
    else{try{await navigator.clipboard.writeText(url);toast("لینک کپی شد")}catch(e){prompt("لینک:",url)}}
  };
}

/* ---------- viewer mode ---------- */
function vcard(d){
  const L=["BEGIN:VCARD","VERSION:3.0","FN:"+(d.name||""),"TITLE:"+(d.title||"")];
  if(d.phone)L.push("TEL:"+d.phone);if(d.email)L.push("EMAIL:"+d.email);
  if(d.web)L.push("URL:"+d.web);if(d.address)L.push("ADR:;;"+d.address+";;;;");
  L.push("END:VCARD");return L.join("\r\n");
}
function href(k,v){
  if(k==="phone")return "tel:"+v.replace(/\s/g,"");
  if(k==="email")return "mailto:"+v;
  if(k==="web")return /^https?:/.test(v)?v:"https://"+v;
  if(k==="insta")return "https://instagram.com/"+v.replace(/^@/,"");
  return "";
}
function showCard(d){
  document.title=d.name||"کارت";
  let h='<div class="head"><h1>'+esc(d.name||"بدون نام")+'</h1>'+(d.title?'<p>'+esc(d.title)+'</p>':'')+'</div><div class="pad">';
  for(const [k,t,c] of FIELDS.slice(2)){
    const v=d[k];if(!v)continue;
    const l=href(k,v);
    const inner='<div class="k">'+t+'</div><div class="v'+(c==="ltr"?' ltr':'')+'">'+esc(v)+'</div>';
    h+=l?'<a class="row" href="'+esc(l)+'">'+inner+'</a>':'<div class="row">'+inner+'</div>';
  }
  h+='<button id="btnVcf">ذخیره در مخاطبین</button><button class="alt" id="btnMine">کارت خودم را بساز</button></div>';
  app.innerHTML=h;
  document.getElementById("btnVcf").onclick=()=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([vcard(d)],{type:"text/vcard"}));
    a.download=(d.name||"contact")+".vcf";a.click();
  };
  document.getElementById("btnMine").onclick=()=>{history.replaceState(null,"",baseUrl());showForm()};
}

/* ---------- start ---------- */
const raw=location.hash.replace(/^#/,"");
if(raw)decode(raw).then(showCard).catch(()=>{app.innerHTML='<div class="pad" style="text-align:center;line-height:2"><b>لینک ناقص است</b><br>دوباره از فرستنده دریافت کنید.</div>'});
else showForm();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
